name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to the commit of a release, so a moved tag cannot change what runs; the comment
      # says which release, and Dependabot keeps them up to date (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # the tools have no npm dependencies to cache
      - name: Install the assembler and the emulator
        run: sudo apt-get update && sudo apt-get install -y 64tass vice xvfb
      - run: make
      - run: make test
      - name: Check the play page's HTML
        run: npx --yes html-validate@11.21.1 site/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sleazeburg64
          path: |
            build/sleazeburg64.prg
            build/screenshot-*.png
            build/vice-*.log

  # After the tests pass on main: publish the tested program and the play page in site/ with GitHub Pages,
  # at https://mselin.github.io/Sleazeburg64/. (The repository's Pages source has to be "GitHub Actions".)
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      # (whichever try deployed it)
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url || steps.deploy_last.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sleazeburg64
          path: build
      - name: Put the page together
        run: |
          mkdir -p public
          cp site/index.html site/icon-*.png public/
          cp build/sleazeburg64.prg public/
          cp build/screenshot-autopilot.png public/screenshot.png
      # Named after the run's attempt, so that re-running this job (as the deploy step asks when GitHub Pages fails)
      # deploys its own upload: a run keeps the uploads of every attempt, and two of the same name stop the deploy
      # ("Multiple artifacts named github-pages were unexpectedly found"), as in mselin/gta-c64#44.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      # GitHub's deploy step sometimes cannot find the page it was handed a moment before ("No artifacts named
      # github-pages were found"), though the upload just above succeeded: the list of the run's artifacts lags
      # behind. A look a little later finds it. So the deploy gets three tries, with a wait before the second
      # and the third, and the job fails only if the last one does. A try that fails this way has not started
      # a deployment, so the next one starts clean.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the second try
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the last try
        if: steps.deploy_again.outcome == 'failure'
        run: sleep 90
      - id: deploy_last
        if: steps.deploy_again.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # The one check that branch protection requires, so jobs can be added or renamed
  # above without touching the repository settings.
  ok:
    name: All checks passed
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
